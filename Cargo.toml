[workspace]
resolver = "3"
members = [
    "plugins/reiss-mcpherson-delay",
    "plugins/reiss-mcpherson-vibrato",
    "plugins/reiss-mcpherson-flanger",
    "plugins/reiss-mcpherson-chorus",
    "plugins/reiss-mcpherson-pingpong",
    "plugins/reiss-mcpherson-parametric-eq",
    "plugins/reiss-mcpherson-wahwah",
    "plugins/reiss-mcpherson-phaser",
    "plugins/reiss-mcpherson-tremolo",
    "plugins/reiss-mcpherson-ringmod",
    "plugins/reiss-mcpherson-compressor",
    "plugins/reiss-mcpherson-distortion",
    "plugins/reiss-mcpherson-panning",
    "plugins/reiss-mcpherson-robotization",
    "plugins/reiss-mcpherson-pitchshift",
]

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.92"

# truce crates from crates.io. `truce` itself opts out of default
# features so each plugin enables formats explicitly via its own
# `[features]` block.
[workspace.dependencies]
truce = { version = "3.0", default-features = false }
truce-core = "3.0"
truce-params = "3.0"
truce-clap = "3.0"
truce-vst3 = "3.0"
truce-au = "3.0"
truce-standalone = "3.0"
truce-gui = { version = "3.0", default-features = false }
truce-gui-types = "3.0"
truce-plugin = "3.0"
truce-vst2 = "3.0"
truce-lv2 = "3.0"
truce-aax = "3.0"
truce-loader = "3.0"
truce-font = "3.0"
clap-sys = "0.5"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.shell]
inherits = "release"
