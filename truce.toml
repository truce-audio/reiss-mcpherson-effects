# truce plugin project configuration for the Reiss / McPherson port.

[vendor]
name = "Truce (Reiss-McPherson)"
id = "com.truce.reiss-mcpherson"
url = "https://github.com/truce-audio/reiss-mcpherson-effects"
au_manufacturer = "Rmcp"

# bundle_ids pin the 1.x name-derived plugin ids ("Reiss Delay" ->
# reissdelay); truce 2.0 derives clap_id / vst3_id / the state hash
# from bundle_id, so changing these would orphan shipped sessions.

[[plugin]]
name = "Reiss Delay"
bundle_id = "reissdelay"
crate = "reiss-mcpherson-delay"
category = "effect"
fourcc = "RDly"
au_tag = "Effects"
aax_category = "Delay"
vst3_subcategory = "Delay"

